<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo</title>
<style>
:root {
  color-scheme: light;
  --bg: #EDF0F3; --panel: #F8F9FB; --raised: #FFFFFF; --ink: #1B2230; --quiet: #687385; --faint: #9AA3B0;
  --rule: #D6DBE2; --rule-soft: #E4E8ED;
  --claude: #A86A12; --codex: #0E7468; --agy: #5B45E0; --human: #3A4352; --system: #687385;
  --signal: #F5C518; --signal-ink: #5A4500; --good: #1F7A4A; --bad: #B4322A;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --code: ui-monospace, "SF Mono", Menlo, monospace;
  --r-s: 6px; --r-m: 10px;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #14181F; --panel: #1A1F27; --raised: #212733; --ink: #E7EAF0; --quiet: #9AA4B4; --faint: #6B7586;
    --rule: #2D3440; --rule-soft: #252B36; --claude: #E0A040; --codex: #3CC2AE; --agy: #9B8CFF; --human: #C9CFDA;
    --signal-ink: #1B1500; --good: #4CC487; --bad: #F07468; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--ui); color: var(--ink); background: var(--bg); font-feature-settings: "tnum";
  display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--raised); }
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]), select, textarea {
  color: var(--ink); background-color: var(--raised); caret-color: var(--ink); }
input::placeholder, textarea::placeholder { color: var(--quiet); opacity: 1; }
select option { color: var(--ink); background: var(--raised); }
:focus-visible { outline: 2px solid var(--agy); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center;
  padding: 12px 20px 12px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { display: block; }
.duo-ver { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kind { border: 0; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.kind legend { padding: 0; margin-bottom: 4px; }
.badge.auto { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--codex); color: var(--codex); margin-left: 4px; }
.item.autofix { border-left: 3px solid var(--codex); border-radius: 0; padding-left: 8px; }
.item.off { border-left: 3px solid var(--warn, #b45309); border-radius: 0; padding-left: 8px; }
.sheet .item .top { align-items: flex-start; }
.sheet .item .top > .btn, .sheet .item .top > .badge { white-space: nowrap; flex: none; }
.vshots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.vshot { width: 180px; height: auto; border: 1px solid var(--rule); border-radius: var(--r-s); display: block; }
.duo-now.trial { padding: 8px 10px; border: 1px solid var(--codex); border-radius: 10px; }
.duo-now { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.warn { color: var(--warn, #b45309); }
.slot-header { display: inline-flex; gap: 6px; align-items: center; }
.slot-home:empty, .slot-settings:empty, .slot-run-side:empty { display: none; }
.slot-panel { margin: 8px 0; }
.home { overflow: auto; height: 100%; }
.home-inner { max-width: 880px; margin: 0 auto; padding: 28px 24px 48px; }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.home-head h2 { margin: 0; font: 500 24px/1.2 var(--serif); }
.home-taskmaps { margin: 20px 0; border: 1px solid var(--rule); border-radius: var(--r-s); padding: 14px; }
.home-taskmaps > summary { cursor: pointer; font-weight: 600; }
.home-taskmaps p { color: var(--quiet); }
.home-taskmap { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
.home-taskmap > div { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
.home-taskmap strong { display: block; }
#featureNav:empty { display: none; }
.side .new.fnav { border-style: solid; }
.side .new.fnav.on { background: var(--raised); color: var(--ink); border-color: var(--quiet); }
.icon-btn { border: 1px solid transparent; background: none; border-radius: var(--r-s); padding: 5px 8px; color: var(--quiet); }
.icon-btn:hover { background: var(--rule-soft); color: var(--ink); }
.task-line { min-width: 0; }
.task-title { font: 500 17px/1.3 var(--serif); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-sub { color: var(--quiet); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header > .rail { grid-column: 1 / -1; grid-row: 2; justify-content: center; flex-wrap: wrap; }
header > .hbtns { grid-column: 3; grid-row: 1; }
.rail { display: flex; align-items: center; gap: 2px; }
.rail span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); padding: 4px 8px; border-radius: 99px; }
.rail span b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid currentColor; font-size: 10.5px; font-weight: 600; }
.rail span.done { color: var(--quiet); }
.rail span.done b { background: var(--quiet); border-color: var(--quiet); color: var(--panel); }
.rail span.now { color: var(--ink); background: var(--rule-soft); font-weight: 600; }
.rail span.now b { border-color: var(--ink); }
.rail em { font-style: normal; }
.rail i { width: 10px; height: 1.5px; background: var(--rule); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr) 420px; min-height: 0; }
.app.no-side { grid-template-columns: 0 minmax(0, 1fr) 420px; }
.app.wide, .app.wide.no-side { grid-template-columns: 0 minmax(0, 1fr) 600px; }
aside.side { border-right: 1px solid var(--rule); background: var(--panel); overflow-y: auto; padding: 14px 10px; }
.app.no-side aside.side, .app.wide aside.side { visibility: hidden; padding: 0; border: 0; overflow: hidden; }
.side h2 { font-size: 12.5px; font-weight: 600; color: var(--quiet); margin: 4px 8px 8px; }
.side .new { width: 100%; text-align: left; border: 1px dashed var(--rule); background: none; border-radius: var(--r-s);
  padding: 8px 10px; color: var(--quiet); margin-bottom: 14px; }
.side .new:hover { border-color: var(--quiet); color: var(--ink); }
.sess { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: var(--r-s); }
.sess:hover { background: var(--rule-soft); }
.sessrow { position: relative; }
.sessrow .sess { padding-right: 34px; }
.sessdel { position: absolute; right: 6px; top: 7px; border: 0; background: none; color: var(--faint); font-size: 12px; padding: 2px 4px; border-radius: 4px; opacity: 0; }
.sessrow:hover .sessdel, .sessdel:focus, .sessdel.armed { opacity: 1; }
.sessdel.armed { color: var(--bad); font-weight: 600; }
.sess.on { background: var(--raised); box-shadow: inset 0 0 0 1px var(--rule); }
.sess .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.sess .m { display: block; color: var(--faint); font-size: 11.5px; }

main { display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
#statusbar { grid-row: 1; }
#progress { grid-row: 2; }
#progressLabel { grid-row: 3; }
#runPanes { grid-row: 4; display:flex; flex-wrap:wrap; gap:8px; padding:10px 22px; border-bottom:1px solid var(--rule); }
#runPanes [aria-selected="true"] { background:var(--ink); color:var(--panel); }
#timeline, #taskmap-pane, #summary-pane { grid-row: 5; min-height: 0; min-width:0; }
#taskmap-pane { overflow:auto; padding:10px 0 24px; }
#taskmap-pane[hidden], #timeline[hidden], #summary-pane[hidden] { display:none!important; }
#summary-pane { overflow:auto; padding:20px; }
.summary-document { max-width:960px; margin:auto; overflow-wrap:anywhere; }
.summary-document pre, .summary-document table { display:block; max-width:100%; overflow:auto; }
.question-card { margin:16px 22px; padding:18px; border:1px solid var(--rule); border-radius:10px; background:var(--raised); overflow-wrap:anywhere; }
.question-card h3 { margin-top:0; }
.question-options { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
.question-options button { white-space:normal; text-align:left; max-width:100%; }
.question-card textarea { width:100%; min-height:76px; box-sizing:border-box; resize:vertical; padding:10px; }
.question-answer { white-space:pre-wrap; }
#composer { grid-row: 6; }
main > .start, main > .home { grid-row: 1 / -1; min-height: 0; }
.statusbar { display: flex; align-items: center; gap: 10px; padding: 9px 22px; border-bottom: 1px solid var(--rule-soft); min-height: 44px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.running { background: var(--codex); box-shadow: 0 0 0 4px color-mix(in srgb, var(--codex) 18%, transparent); }
.dot.waiting { background: var(--signal); }
.dot.done { background: var(--good); } .dot.error { background: var(--bad); }
.statustext { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statustext b { font-weight: 600; }
.ctl { display: flex; gap: 6px; }
.btn { border: 1px solid var(--rule); background: var(--raised); border-radius: var(--r-s); padding: 5px 11px; font-size: 13px; }
.btn:hover { border-color: var(--quiet); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- timeline ---------- */
.timeline { overflow-y: auto; padding: 6px 0 24px; }
.divider { display: flex; align-items: center; gap: 10px; margin: 18px 22px 6px; color: var(--quiet); font-size: 12px; font-weight: 600; }
.divider::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.row { display: grid; grid-template-columns: 58px 104px minmax(0, 1fr) auto; gap: 12px; align-items: baseline;
  padding: 7px 22px; border: 0; background: none; width: 100%; text-align: left; border-left: 3px solid transparent; }
.row { content-visibility: auto; contain-intrinsic-size: auto 36px; }
.row:hover { background: var(--rule-soft); }
.row.sel { background: var(--raised); border-left-color: var(--ink); }
.row .time { color: var(--faint); font-size: 12px; }
.who { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.who::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c, var(--quiet)); flex: none; }
.row .sum { min-width: 0; }
.row .kind { color: var(--quiet); font-size: 12px; margin-right: 6px; }
.tags { display: flex; gap: 5px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--rule-soft); color: var(--quiet); white-space: nowrap; }
.tag.warn { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.tag.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.tag.need { background: var(--signal); color: var(--signal-ink); font-weight: 600; }
.row.decision { padding-top: 11px; padding-bottom: 11px; }
.row.decision .sum { font: 500 15px/1.35 var(--serif); }
.diamond { width: 11px; height: 11px; transform: rotate(45deg); background: var(--ink); flex: none; border-radius: 2px; }
.row.decision .who::before { display: none; }
.row.need { background: color-mix(in srgb, var(--signal) 16%, transparent); border-left-color: var(--signal); }
.row.need .diamond { background: var(--signal); box-shadow: 0 0 0 2px var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .row.need.fresh { animation: callout 1.6s ease-out 1; }
  @keyframes callout { 0% { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--signal) 55%, transparent); } 100% { box-shadow: none; } }
}
.working { display: grid; grid-template-columns: 58px 104px 1fr auto; gap: 12px; align-items: center; padding: 8px 22px; color: var(--quiet); }
.pulse { display: inline-flex; gap: 3px; }
.pulse i { width: 5px; height: 5px; border-radius: 50%; background: var(--c, var(--quiet)); opacity: .35; }
@media (prefers-reduced-motion: no-preference) {
  .pulse i { animation: blink 1.2s infinite; } .pulse i:nth-child(2) { animation-delay: .2s; } .pulse i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: 1; } }
}
.empty { max-width: 520px; margin: 14vh auto 0; text-align: center; color: var(--quiet); }

.composer { display: flex; gap: 8px; padding: 12px 22px 14px; border-top: 1px solid var(--rule); background: var(--panel); }
.composer textarea { flex: 1; resize: none; height: 40px; border: 1px solid var(--rule); background: var(--raised);
  border-radius: var(--r-s); padding: 9px 11px; line-height: 1.35; }

/* ---------- inspector ---------- */
.inspector { border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; min-width: 0; }
.ins-head { position: sticky; top: 0; z-index: 2; background: var(--panel); display: flex; align-items: center; gap: 8px;
  padding: 12px 18px; border-bottom: 1px solid var(--rule-soft); }
.ins-head h3 { margin: 0; font-size: 13.5px; flex: 1; }
.ins-body { padding: 16px 18px 28px; }
.section { margin-bottom: 22px; }
.section > h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--quiet); font-weight: 600; }
.metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.metric { background: var(--raised); border: 1px solid var(--rule-soft); border-radius: var(--r-s); padding: 9px 10px; }
.metric b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.metric span { color: var(--quiet); font-size: 12px; }
.budget { display: grid; grid-template-columns: 62px 1fr 64px; gap: 8px; align-items: center; font-size: 12.5px; margin: 5px 0; }
.bar { height: 6px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--quiet); border-radius: 3px; }
.bar i.over { background: var(--bad); }
.flag { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
.linkish { border: 0; background: none; color: var(--quiet); font-size: 12px; text-decoration: underline; padding: 0 4px; }
.flag button { margin-left: auto; white-space: nowrap; border: 0; background: none; color: var(--quiet); font-size: 12px; text-decoration: underline; }
.wins { display: grid; grid-template-columns: 104px 1fr 44px; gap: 8px; align-items: center; font-size: 12.5px; margin: 5px 0; }
.agent-row { display: grid; grid-template-columns: 104px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; font-size: 13px; }
.agent-acts { display: flex; gap: 5px; } .agent-acts .btn { padding: 3px 9px; font-size: 12px; }
.roles { display: grid; grid-template-columns: 74px 1fr; gap: 3px 10px; font-size: 13px; }
.roles dt { color: var(--quiet); }
.roles dd { margin: 0; }
.roles dd { min-width: 0; overflow-wrap: anywhere; line-height: 1.5; }
.roles .model-name { display: block; font-size: 12px; }

/* ---------- decision card ---------- */
.dec-title { font: 500 19px/1.3 var(--serif); margin: 0 0 4px; }
.dec-meta { color: var(--quiet); font-size: 12.5px; margin-bottom: 14px; }
.reasons.past { background: var(--rule-soft); color: var(--quiet); }
.reasons { margin: 0 0 14px; padding: 10px 12px; border-radius: var(--r-s); background: color-mix(in srgb, var(--signal) 22%, transparent); font-size: 13px; }
.reasons ul { margin: 4px 0 0; padding-left: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--quiet); font-size: 12px; margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.matrix { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.matrix th { font-weight: 500; color: var(--quiet); text-align: center; padding: 4px 2px; vertical-align: bottom; }
.matrix th.opt { text-align: left; }
.matrix td { padding: 6px 2px; border-top: 1px solid var(--rule-soft); text-align: center; vertical-align: middle; }
.matrix td.opt { text-align: left; padding-right: 8px; max-width: 190px; }
.matrix td.opt b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.matrix tr.win td { background: color-mix(in srgb, var(--good) 8%, transparent); }
.matrix tr.pick { cursor: pointer; }
.matrix tr.pick:hover td { background: var(--rule-soft); }
.matrix tr.chosen td.opt b::after { content: " chosen"; color: var(--good); font-weight: 600; font-size: 11.5px; }
.opt-id { color: var(--quiet); margin-right: 5px; }
.cell { display: inline-flex; gap: 2px; align-items: center; justify-content: center; min-height: 18px; }
.cell.dis { outline: 1.5px dashed var(--bad); outline-offset: 2px; border-radius: 4px; }
.pip { border-radius: 50%; background: var(--c); flex: none; }
.pip.self { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.total { font-weight: 600; }
.gate-fail { color: var(--bad); font-weight: 600; }
.expl { margin-top: 14px; }
.expl details { border-top: 1px solid var(--rule-soft); padding: 8px 0; }
.expl summary { cursor: pointer; font-size: 13px; }
.expl table { width: 100%; font-size: 12.5px; border-collapse: collapse; margin-top: 6px; }
.expl td { padding: 4px 4px; vertical-align: top; border-top: 1px solid var(--rule-soft); }
.expl td:first-child { color: var(--quiet); white-space: nowrap; width: 84px; }
.answer { margin-top: 16px; padding: 14px; border: 1.5px solid var(--signal); border-radius: var(--r-m); background: var(--raised); }
.answer h4 { margin: 0 0 8px; font-size: 13.5px; }
.answer textarea { width: 100%; height: 60px; resize: vertical; border: 1px solid var(--rule); border-radius: var(--r-s); padding: 8px; background: var(--panel); margin: 8px 0; }

/* ---------- turn view ---------- */
.tabs { display: flex; gap: 2px; }
.tabs button { border: 0; background: none; padding: 4px 9px; border-radius: var(--r-s); color: var(--quiet); font-size: 12.5px; }
.tabs button.on { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.prose { font-size: 13.5px; line-height: 1.6; overflow-wrap: anywhere; }
.prose pre { background: var(--raised); border: 1px solid var(--rule-soft); border-radius: var(--r-s); padding: 10px; overflow-x: auto; font: 12px/1.5 var(--code); }
.prose code { font: 12px var(--code); background: var(--rule-soft); padding: 1px 4px; border-radius: 3px; }
.prose pre code { background: none; padding: 0; }
.prose table { border-collapse: collapse; font-size: 12.5px; }
.prose td, .prose th { border: 1px solid var(--rule); padding: 3px 7px; }
.prose blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--rule); color: var(--quiet); }
.prose h1, .prose h2, .prose h3 { font-size: 14px; margin: 14px 0 4px; }
.issues { font-size: 12.5px; margin: 0 0 12px; padding: 0; list-style: none; }
.issues li { padding: 5px 8px; border-left: 2px solid var(--bad); margin-bottom: 4px; background: color-mix(in srgb, var(--bad) 7%, transparent); }
.paneview { font: 10.5px/1.35 var(--code); background: #0F1218; color: #D3D8E0; border-radius: var(--r-s); padding: 10px;
  height: 52vh; overflow: auto; white-space: pre; margin: 0 0 10px; }
.keys { display: flex; flex-wrap: wrap; gap: 5px; }
.keys button { border: 1px solid var(--rule); background: var(--raised); border-radius: 5px; padding: 3px 9px; font-size: 12px; }
.inline { display: flex; gap: 6px; margin-bottom: 8px; }
.inline input { flex: 1; border: 1px solid var(--rule); border-radius: var(--r-s); padding: 6px 9px; background: var(--raised); }

/* ---------- start screen ---------- */
.start { overflow-y: auto; padding: 7vh 28px 40px; }
.start-inner { max-width: 680px; margin: 0 auto; }
.start label.big { display: block; font: 500 22px/1.3 var(--serif); margin-bottom: 10px; }
.start textarea.task { width: 100%; min-height: 128px; resize: vertical; border: 1px solid var(--rule); border-radius: var(--r-m);
  background: var(--raised); padding: 14px 16px; font: 16px/1.5 var(--serif); }
.field { margin-top: 20px; }
.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
.field > small { display: block; color: var(--quiet); font-size: 12.5px; margin-top: 6px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--raised); padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 4px; font-size: 13px; color: var(--quiet); }
.seg button.on { background: var(--ink); color: var(--panel); }
.agents { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--raised); border-radius: 99px; padding: 5px 12px 5px 10px; font-size: 13px; }
.chip input { accent-color: var(--c); }
.chip small { color: var(--faint); }
.chip.missing { color: var(--faint); border-style: dashed; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.start select, .start input[type=text], .start input[type=number] { width: 100%; border: 1px solid var(--rule); border-radius: var(--r-s);
  background: var(--raised); padding: 7px 9px; }
.start .go { margin-top: 26px; display: flex; align-items: center; gap: 14px; }

<script>
const recordUIError=error=>fetch('/api/ui-diagnostic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:String(error?.message || error),stack:String(error?.stack || '')})}).catch(()=>{});

<script type="module">
import {createNotificationCenter} from '/notifications.js';

const $ = s => document.querySelector(s);
let noticeStorage = null;
try { noticeStorage = localStorage; } catch {}
const notices = createNotificationCenter($('#notificationBar'), noticeStorage);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PHASES = [["frame","Plan"],["scout","Research"],["research_check","Research review"],["feasibility","Feasibility"],["deep","Build"],["verify","Verify"]];
const COLORS = {claude: "var(--claude)", codex: "var(--codex)", agy: "var(--agy)", human: "var(--human)", system: "var(--system)"};
const KIND_LABEL = {plan_review: "reviewed the plan", exchange: "wrote the plan", followup: "added", restart: "", scout: "researched", build: "built",
  settings: "changed settings", setup: "planned the sandbox", setup_check: "checked the sandbox", setup_fix: "fixed the sandbox", warning: "", revise: "revised", critique: "reviewed", verify: "verified", secure: "reviewed security", message: "", task: "", decision: "", done: ""};
const MODE_LABEL = {auto: "Auto", big: "Ask on big decisions", always: "Ask always"};
const STATUS_WORD = {booting: "starting", waiting: "waiting for you", running: "working", paused: "paused",
  done: "done", stopped: "unfinished", error: "unfinished"};
const ACTIVE = ["booting", "waiting", "running", "paused"];
function workflowPhases(s) {
  const phases = [["frame", s?.role_plan_step === 'review' ? "Plan review" : "Planning"]];
  if (s?.stage_requests?.research) phases.push(["scout", "Research"], ["research_check", "Research review"]);
  if (s?.stage_requests?.feasibility) phases.push(["feasibility", "Feasibility"]);
  phases.push(["deep", "Build and critique"]);
  if (s?.stage_requests?.verify || s?.stage_requests?.security) phases.push(["verify", "Required checks"]);
  if (!s || s.goal_loop_version === 2) phases.push(['cycle_summary', 'Detailed summary'], ['goal_check', 'Goal check'], ['further_work', 'Assign further work']);
  return phases;
}

let live = null, past = null, view = "auto", sel = null, insTab = "reply";
let runPane = ['chat','summary'].includes(sessionStorage.getItem('duo.run-pane')) ? sessionStorage.getItem('duo.run-pane') : 'map';
function setRunPane(pane) {
  runPane = ['chat','summary'].includes(pane) ? pane : 'map';
  sessionStorage.setItem('duo.run-pane', runPane);
  applyRunPane();
  if(runPane==='summary') renderSummaryDocument(S());
}
function applyRunPane() {
  if (!$('#runPanes')) return;

  $('#timeline').hidden = runPane !== 'chat';
  $('#summary-pane').hidden = runPane !== 'summary';
  for (const button of document.querySelectorAll('[data-run-pane]')) {

/* ponytail: a small Markdown subset (headings, lists, code, tables, quotes, bold, links). Upgrade to a full parser if agents start using more. */
function md(src) {
  const blocks = []; let s = String(src || "").replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => { blocks.push(c); return "\u0000" + (blocks.length - 1) + "\u0000"; });
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; const lines = s.split("\n"); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    const blk = l.match(/^\u0000(\d+)\u0000$/);
    if (blk) { out.push("<pre><code>" + esc(blocks[+blk[1]]) + "</code></pre>"); i++; continue; }
    if (/^#{1,4}\s/.test(l)) { out.push("<h3>" + inline(l.replace(/^#+\s/, "")) + "</h3>"); i++; continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < lines.length && /^\|/.test(lines[i])) { if (!/^\|[\s|:-]+\|$/.test(lines[i])) rows.push(lines[i]); i++; }
      out.push("<table>" + rows.map((r, k) => "<tr>" + r.replace(/^\||\|$/g, "").split("|").map(c => (k ? "<td>" : "<th>") + inline(c.trim()) + (k ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table>"); continue; }
    if (/^\s*([-*+]|\d+[.)])\s/.test(l)) { const ord = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s/.test(lines[i])) { items.push("<li>" + inline(lines[i].replace(/^\s*([-*+]|\d+[.)])\s/, "")) + "</li>"); i++; }
      out.push((ord ? "<ol>" : "<ul>") + items.join("") + (ord ? "</ol>" : "</ul>")); continue; }
    if (/^>\s?/.test(l)) { out.push("<blockquote>" + inline(l.replace(/^>\s?/, "")) + "</blockquote>"); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(#|\||>|\s*([-*+]|\d+[.)])\s|\u0000)/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push("<p>" + inline(para.join(" ")) + "</p>");
  }
  return out.join("");
}

/* Keyed reconcile: unchanged rows keep their DOM node, so scroll, focus and hover never jump. */

  let prev = null;
  for (const it of items) {
    let c = rowCache.get(it.key);
    const editingQuestion = c && c.el.dataset?.questionKey && c.el.dataset.open === 'true'
      && questionRegistry.get(c.el.dataset.questionKey)?.open && editingWithin(c.el);
    if ((!c || c.html !== it.html) && !editingQuestion) {
      const tpl = document.createElement("template"); tpl.innerHTML = it.html.trim();
      const el = tpl.content.firstElementChild;
      if (c) c.el.replaceWith(el);
      c = {el, html: it.html}; rowCache.set(it.key, c);
      el.querySelectorAll?.("[data-sel]").forEach(b => b.onclick = () => select(b.dataset.sel));
      if (el.dataset?.sel) el.onclick = () => select(el.dataset.sel);
      el.querySelectorAll?.("[data-pane]").forEach(b => b.onclick = () => { insTab = "pane"; select("p:" + b.dataset.pane); });

    if (want !== c.el) container.insertBefore(c.el, want);
    prev = c.el;
  }
  const mine = new Set(items.map(i => rowCache.get(i.key)?.el));
  [...container.children].forEach(ch => { if (!mine.has(ch)) ch.remove(); });   // drop anything left from a cleared cache

async function sendQuestionAnswer(q,value,custom=false) {
  const payload={id:q.runId,kind:q.kind,question_id:q.id};
  if(q.kind==='approval') Object.assign(payload,{agent:q.agent,question:q.text,approve:value});
  else payload.text=value;
  return api('/api/question-answer',payload);
}
function wireQuestionCard(root) {
  for(const form of root.querySelectorAll?.('form[data-question]') || []) {
    const send=async(value,custom)=>{
      const q=questionRegistry.get(form.dataset.question); if(!q || !q.open) return;
      for(const button of form.querySelectorAll('button')) button.disabled=true;
      try { await sendQuestionAnswer(q,value,custom); if(!custom || form.elements.answer?.value.trim()===value) questionDrafts.delete(form.dataset.question); saveInputDrafts('duo.question-drafts',questionDrafts); }
      catch(error) { form.querySelector('.question-error').textContent=error.message; }
      finally { for(const button of form.querySelectorAll('button')) button.disabled=false; }
    };
    form.onsubmit=event=>{event.preventDefault();const text=form.elements.answer?.value.trim();if(text)send(text,true);};
    if(form.elements.answer) {
      const input=form.elements.answer;
      input.value=questionDrafts.get(form.dataset.question) || '';
      input.oninput=()=>{questionDrafts.set(form.dataset.question,input.value);saveInputDrafts('duo.question-drafts',questionDrafts);};
    }
    const delegate=form.querySelector('[data-question-delegate]');if(delegate)delegate.onclick=()=>send('Use your recommendation within the existing task scope and existing resource limits. Record your choice and reasoning.',true);
    for(const button of form.querySelectorAll('[data-question-option]')) button.onclick=()=>send(JSON.parse(button.dataset.questionOption),false);
  }
}

function renderTimeline(s) {
  const tl = $("#timeline");
  if (!s) {
    const lu = live?.last_unfinished;
    patchList(tl, [{key: "empty" + (lu?.id ?? ""), html: `<div class="empty">${lu ? `<div class="resume-card" style="text-align:left"><div><span class="hint">Continue where you left off</span><b>${esc(lu.title)}</b></div><button class="btn primary" id="emptyResume">Continue</button></div>` : ""}
      <p style="font:500 20px/1.3 var(--serif);color:var(--ink)">Give the agents something to work on.</p>
      <p>A large model plans, a second reviews the plan, a smaller one builds, and another reviews the work.</p>
      <button class="btn ${lu ? "" : "primary"}" id="emptyNew">New task</button></div>`}]);
    $("#emptyResume")?.addEventListener("click", () => continueRun(lu.id));
    return;
  }
  const near = !isTextEditingTarget(document.activeElement) && runPane === 'chat' && tl.scrollHeight - tl.scrollTop - tl.clientHeight < 140;
  const items = [];
  if (past && live?.session) items.push({key: "ro", html: `<div class="readonly">This is a saved run. You can chat about it without starting work. <button id="backLive">Back to the current run</button></div>`});
  if(s.prior_run_context) items.push({key:'prior:'+s.id,html:`<section class="question-card"><h3>Previous run context</h3><p>This run starts from the saved ${s.prior_run_context.kind==='detailed'?'completion summary':'state handoff'} of ${esc(s.prior_run_context.run_id)}.</p><p class="hint">The current request controls the work. Earlier results still need to match the current files.</p></section>`});
  if (!ACTIVE.includes(s.status)) items.push({key: "recap:" + s.id + s.status + s.entries.length, html: recapHtml(s)});
  let lastPhase = null, lastCycle = 1;
  for (const e of s.entries) {
    if (["warning","error","recovery"].includes(e.kind) || e.invalid || ["blocked","needs_human"].includes(e.outcome)) continue;
    if (e.author === "human" && e.kind === "decision") continue;      // the decision row already says what you chose
    if ((e.cycle ?? 1) !== lastCycle) {
      lastCycle = e.cycle ?? 1; lastPhase = null;
      items.push({key: "cyc:" + e.n, html: `<div class="divider cycle">Cycle ${lastCycle}: ${esc((e.prose ?? "").split("\n")[0].slice(0, 90))}</div>`});
    }
    const ph = e.phase === "task" ? null : e.phase;
    if (ph && ph !== lastPhase && !["decide", "done"].includes(ph)) {
      const p = [["refs", "References"], ...PHASES].find(x => x[0] === ph);
      items.push({key: "div:" + e.n, html: `<div class="divider">${p ? p[1] : ph}</div>`}); lastPhase = ph;
    }
    items.push({key: s.id + ":" + e.n, html: rowHtml(e, s)});
  }
  for (const p of s.pending ?? []) {
    items.push({key: "w:" + p.n + p.agent, html: `<div class="working" style="--c:${COLORS[p.agent]}"><span class="time"></span><span class="who" style="--c:${COLORS[p.agent]}">${esc(labelOf(p.agent))}</span>
      <span><span class="pulse"><i></i><i></i><i></i></span>  ${esc(KIND_LABEL[p.kind] ?? p.kind)}${p.option_ids?.length ? " " + esc(p.option_ids.join(", ")) : ""}  <span class="hint">${fmtSecs(Math.floor(p.age / 5) * 5)}</span></span>
      <button class="btn" data-pane="${esc(p.agent)}">Watch</button>${p.now ? `<span class="now" title="${esc(p.now)}">${esc(p.now)}</span>` : ""}</div>`});
  }
  for (const question of runQuestions(s)) items.push({key:'question:'+s.id+':'+question.id,html:questionCard(question,s)});
  const conversations=[...(s.helper || []).map((h,i)=>({...h,id:'legacy-'+i,status:h.a?'answered':'legacy-interrupted'})),...(s.conversation || [])];
  for(const h of conversations) items.push({key:'conversation:'+s.id+':'+h.id,html:`<section class="question-card"><h3>You asked</h3><div class="prose">${md(h.q)}</div><h4>${esc(h.provider || 'Agent')}</h4>${h.a ? `<div class="prose">${md(h.a)}</div>` : `<p class="hint">${h.status==='queued'?'Question queued.':h.status==='working'?'Preparing an answer…':'The answer did not finish. Send the question again or use Retry answer below.'}</p>`}${['failed','interrupted'].includes(h.status)?`<button type="button" class="btn" data-chat-retry="${esc(h.id)}">Retry answer</button>`:''}</section>`});
  patchList(tl, items);
  tl.querySelectorAll('[data-chat-retry]').forEach(button=>button.onclick=async()=>{await api('/api/ask',{run_id:s.id,retry_id:button.dataset.chatRetry});await refreshConversation(s.id);});
  if (near) tl.scrollTo({top: tl.scrollHeight, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

const summaryFiles = new Map();
function renderSummaryDocument(s) {
  const root=$('#summary-pane'); if(!root || runPane!=='summary') return;
  const stage=s?.broker?.completion_summary;
  const record=stage && (['ready','superseded'].includes(stage.status) ? stage : stage.previous);
  const identity=JSON.stringify([s?.id,s?.status,stage]);
  if(root.dataset.identity===identity) return; root.dataset.identity=identity;
  root.replaceChildren();
  const article=document.createElement('article'); article.className='summary-document';root.append(article);
  const heading=document.createElement('h2'); heading.textContent='Detailed summary'; article.append(heading);
  const note=document.createElement('p'); note.className='hint';
  note.textContent=record ? `Version ${record.version} · ${record.model}` : stage?.status==='writing' ? 'The task is done. The summary agent is preparing the document.' : s?.status==='done' ? 'The task is done. Prepare its detailed summary below.' : 'The detailed summary is produced after this run is marked done.';
  article.append(note);
  if(stage && stage.status!=='ready' && record) { const warning=document.createElement('p');warning.textContent='This is an earlier saved summary. Check the current run and evidence before reusing it.';article.append(warning); }
  if(s?.status==='done' && stage?.status!=='writing') {
    const retry=document.createElement('button');retry.className='btn';retry.textContent=record?'Create a new summary version':'Create or retry summary';
    retry.onclick=async()=>{retry.disabled=true;try{await api('/api/completion-summary',{id:s.id});}catch(error){note.textContent=error.message;}finally{retry.disabled=false;}};article.append(retry);
  }
  if(!record) return;
  const prepare=document.createElement('button'); prepare.className='btn';prepare.textContent='Prepare another run';
  prepare.onclick=async()=>{const seed=await api('/api/task-file?'+new URLSearchParams({id:s.id,path:record.next_run}));await showStart(seed.content,s.workspace);};
  article.append(prepare);
  const body=document.createElement('div');body.className='prose';body.textContent='Loading the saved summary document…';article.append(body);
  const key=s.id+':'+record.path+':'+record.sha256;
  if(!summaryFiles.has(key)) summaryFiles.set(key,api('/api/task-file?'+new URLSearchParams({id:s.id,path:record.path})).catch(error=>{summaryFiles.delete(key);throw error;}));
  summaryFiles.get(key).then(file=>{if(root.isConnected && root.dataset.identity===identity) body.innerHTML=file.kind==='text'?md(file.content):'The saved summary is not a text document.';})
    .catch(error=>{if(root.isConnected && root.dataset.identity===identity){body.textContent=error.message;root.dataset.identity='';}});
}

const PROVIDER_NAME = {anthropic: "Claude", openai: "Codex", "google-antigravity": "Antigravity"};
function tokenUseHtml(u) {
  if (!u || !u.turns) return '<p class="hint">Appears after the first turn. Tokens count what Duo sends and receives, not files an agent reads on its own. Time is wall time per turn.</p>';

    `<div class="budget"><span>${esc(KIND_LABEL[kind] || kind)}</span><span class="hint">${v.turns} turn${v.turns > 1 ? "s" : ""}, ${t(v.seconds)}, ${k(v.in)} in, ${k(v.out)} out</span></div>`).join("");
  const top = u.top.map(r => `<button class="linkish" data-sel="e:${r.n}">Turn ${r.n} ${esc(r.kind)}: ${t(r.seconds)}${r.attempts > 1 ? ", " + r.attempts + " tries" : ""}</button>`).join(" ");
  return `<p><b>${t(u.seconds)}</b> elapsed over ${u.turns} turns. <b>${k(u.in)}</b> tokens in, <b>${k(u.out)}</b> out (estimate).</p>${kinds}<p class="hint">Slowest: ${top}</p>`;
}

function insightsHtml(s) {
  if (!s) return `<div class="ins-head"><h3>How it works</h3></div><div class="ins-body prose">
    <ol><li><b>Frame.</b> One agent restates your task and the test for success.</li>
    <li><b>Diverge.</b> Every agent lists options on its own, at least four each.</li>
    <li><b>Scout.</b> Each option gets one cheap probe before anyone commits.</li>
    <li><b>Score.</b> Agents score all options on a rubric for the task type, without seeing each other's scores.</li>
    <li><b>Decide.</b> The best option wins, or you choose when the decision is big.</li>
    <li><b>Build and verify.</b> One agent builds, another reviews, then the work is checked against the success test.</li></ol>
    <p class="hint">Agents write to each other in Simplified Technical English. Duo checks every message and sends broken ones back once.</p></div>`;
  const st = s.stats || {};

    const v = per[k]; const r = Math.min(1, v.turns / Math.max(1, v.budget));
    return `<div class="budget"><span>${label}</span><span class="bar"><i class="${v.turns > v.budget ? "over" : ""}" style="width:${Math.round(r * 100)}%"></i></span><span class="hint">${v.turns}/${v.budget} turns</span></div>`;
  }).join("") || '<p class="hint">Budgets appear as phases run.</p>';
  const roles = s.role_models?.length ? s.role_models.map(r => `<dt>${esc(r.role[0].toUpperCase() + r.role.slice(1))}</dt><dd><b>${esc(PROVIDER_NAME[r.selected_provider] || r.selected_provider)}</b><span class="model-name">${esc(r.selected_model)}</span><span class="hint">${r.escalated ? 'Escalated · ' : ''}${esc(r.size)}${r.fallback ? ' · ' + esc(r.fallback) : ''} · agentic</span></dd>`).join('') : s.roles ? Object.entries(s.roles).map(([r, a]) => `<dt>${esc(r[0].toUpperCase() + r.slice(1))}</dt><dd><span class="who" style="--c:${COLORS[a]}">${esc(labelOf(a))}</span></dd>`).join("") : "";
  const sameProvider = (s.review_independence || []).map(w => w.review === 'plan' ? 'plan review' : 'code review');
  const independenceNote = sameProvider.length

  return `<div class="ins-head"><h3>Insights</h3><button class="btn" data-sel="chat" style="margin-left:auto">Chat${unanswered ? " (" + unanswered + ")" : ""}</button></div><div class="ins-body">
    <div class="section"><div class="metrics">
      <div class="metric"><b>${st.turns || 0}</b><span>agent turns</span></div>
      </div></div>
    <div class="section"><h4>What was built</h4>${(s.shots || []).length
      ? `<div class="refgrid">${s.shots.map(x => x.kind === "image"
          ? `<a href="/api/shot?id=${encodeURIComponent(s.id)}&f=${encodeURIComponent(x.file)}" target="_blank" title="Round ${x.round}"><img loading="lazy" alt="Screenshot of round ${x.round}" src="/api/shot?id=${encodeURIComponent(s.id)}&f=${encodeURIComponent(x.file)}"><span class="hint">Round ${x.round}</span></a>`
          : `<a href="/api/shot?id=${encodeURIComponent(s.id)}&f=${encodeURIComponent(x.file)}" target="_blank" class="hint">Round ${x.round}: smoke output${x.warning ? " (" + esc(x.warning) + ")" : ""}</a>`).join("")}</div>`
      : '<p class="hint">No screenshots yet. Duo takes one of the app after each passing smoke test when Docker is on.</p>'}</div>
    <div class="section"><h4>Things to check</h4>${flags.length ? flags.map(f =>
      `<div class="flag"><span>${esc(f.text)}</span><button data-sel="e:${f.entry_n}">Turn ${f.entry_n}</button></div>`).join("")
      : '<p class="hint">Nothing unusual so far. Duo watches for rubber-stamp approvals, missing verification, scope creep and loops.</p>'}</div>
    <div class="section"><h4>Agents</h4>${agentsHtml(s)}</div>
    <div class="section"><h4>Budget by phase</h4>${budgets}</div>
    <div class="section"><h4>Token use (estimate)</h4>${tokenUseHtml(s.token_use)}</div>

      <div><button class="btn" id="constrainBtn">Add rule</button></div></div></div>`;
}

function renderTurn(s) {

  } else if (canPane) {

      <form class="inline" id="paneform"><input id="panein" placeholder="Type into this pane" aria-label="Type into this pane"><button class="btn">Send</button></form>
      <div class="keys">${["Enter", "Escape", "1", "2", "y", "Up", "Down", "Tab", "C-c"].map(k => `<button data-key="${k}">${{Escape: "Esc", Up: "↑", Down: "↓", "C-c": "Ctrl-C"}[k] || k}</button>`).join("")}</div>

  $("#closeIns").onclick = () => select(null);
  ins.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { insTab = b.dataset.tab; lastInsKey = ""; renderInspector(S()); });
  if ($("#paneform")) {
    $("#paneform").onsubmit = async ev => { ev.preventDefault(); await api("/api/keys", {agent, text: $("#panein").value, enter: true}); $("#panein").value = ""; loadPane(agent); };
    ins.querySelectorAll("[data-key]").forEach(b => b.onclick = async () => { await api("/api/keys", {agent, key: b.dataset.key}); loadPane(agent); });
    paneAgent = agent; loadPane(agent);
  } else paneAgent = null;
}
let paneAgent = null;

const runDrafts = new Map(JSON.parse(sessionStorage.getItem('duo.run-drafts') || '[]'));
function saveRunDraft() { if (S()?.id && $('#msg')) {runDrafts.set(S().id, $('#msg').value);sessionStorage.setItem('duo.run-drafts',JSON.stringify([...runDrafts]));} }

async function loadSessions() {
  const list = await api("/api/sessions").catch(() => []);
  const cur = S() && S().id;
  const q = sessFilter.toLowerCase();
  const shown = list.filter(x => !q || (x.title + " " + (x.project ?? "")).toLowerCase().includes(q));
  const groups = new Map();
  for (const x of shown) { const k = x.project ?? "Other"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); }
  const row = x => `<div class="sessrow"><button class="sess ${x.id === cur ? "on" : ""}" data-id="${esc(x.id)}">
    <span class="t">${esc(x.title)}</span><span class="m">${esc(x.created.slice(5, 16).replace("T", " "))}   ${x.status === "stopped" || x.status === "error" ? "<b>unfinished</b>" : esc(STATUS_WORD[x.status] ?? x.status)}${x.decisions ? "   " + x.decisions + " decision" + (x.decisions > 1 ? "s" : "") : ""}</span></button><button class="sessdel" data-del="${esc(x.id)}" aria-label="Delete this run" title="Delete this run">✕</button></div>`;
  $("#sessions").innerHTML = (list.length >= 10 ? `<input class="filter" id="sessFilter" placeholder="Filter runs" value="${esc(sessFilter)}">` : "") +
    `<p class="hint" style="margin:8px">${(live?.runs || []).filter(r=>ACTIVE.includes(r.status)).length} active · limit ${live?.max_active_runs || 4}. Separate projects can run together.</p>` +
    (shown.length ? [...groups].map(([p, xs]) => `<div class="group"><h3>${esc(p)}</h3>${xs.map(row).join("")}</div>`).join("")
                  : `<p class="hint" style="margin:0 8px">${list.length ? "No runs match." : "Runs you start show up here."}</p>`);
  $("#sessFilter")?.addEventListener("input", ev => { sessFilter = ev.target.value; loadSessions().then(() => { const f = $("#sessFilter"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }); });

    catch (e) { toast(e.message || "Could not delete that run."); } });
  $("#sessions").querySelectorAll("[data-id]").forEach(b => b.onclick = async () => {
    await openSavedRun(b.dataset.id);
  });
}

/* ---------------- wiring ---------------- */
let composeTo = "agents";
let composerRunId = null;
function renderComposerState(s) {
  const form=$('#composer');if(!form)return;
  form.style.display=s && runPane==='chat'?'flex':'none';
  if(composerRunId!==s?.id){composerRunId=s?.id;composeTo='agents';}
  const done=s?.status==='done';
  if((done && composeTo==='helper') || (!done && composeTo==='work'))composeTo='agents';
  const agents=form.querySelector('[data-ct=agents]'),helper=form.querySelector('[data-ct=helper]'),work=form.querySelector('[data-ct=work]');
  agents.textContent=done?'Chat with agent':s && (past || !ACTIVE.includes(s.status))?'Add to run':'Tell the agents';
  helper.hidden=done;if(work)work.hidden=!done;
  form.querySelectorAll('[data-ct]').forEach(button=>{button.classList.toggle('on',button.dataset.ct===composeTo);button.setAttribute('aria-checked',String(button.dataset.ct===composeTo));});
  $('#msg').placeholder=done && composeTo!=='work'?'Ask about the results. This keeps the task marked Done.':composeTo==='work'?'Describe new work. Start work begins another work cycle.':composeTo==='helper'?'Ask about this run without interrupting its workers.':s && (past || !ACTIVE.includes(s.status))?'Add work to this run. This starts another work cycle.':'Message the agents. They answer before continuing.';
  form.querySelector('[type=submit]').textContent=composeTo==='work'?'Start work':'Send';
}
async function refreshConversation(id) {
  const saved=await api('/api/session?'+new URLSearchParams({id}));
  if(S()?.id!==id)return;
  if(past)past=saved;else if(live?.session?.id===id)live.session=saved;
  refresh();
}
function bindComposer() {
  wireRunPanes();
  const f = $("#composer"); if (!f) return;
  f.querySelectorAll('[data-ct]').forEach(button=>button.onclick=()=>{composeTo=button.dataset.ct;renderComposerState(S());});
  renderComposerState(S());
  f.onsubmit = async ev => { ev.preventDefault(); if(f.dataset.sending)return; const t = $("#msg").value.trim(); if (!t) return;
    const s = S();
    if(s && ((s.status==='done' && composeTo!=='work') || composeTo==='helper')) {
      const id=s.id;const send=f.querySelector('[type=submit]');send.disabled=true;f.dataset.sending='1';
      try {await api('/api/ask',{run_id:id,question:t,request_id:crypto.randomUUID(),focus:null});
        if(S()?.id===id && $('#msg').value.trim()===t){$('#msg').value='';saveRunDraft();}
        await refreshConversation(id);setRunPane('chat');
      } finally {send.disabled=false;delete f.dataset.sending;}
      return;
    }
    const questions=runQuestions(s).filter(q=>q.open && q.kind!=='approval');
    if(composeTo==='agents' && !past && questions.length===1) { await sendQuestionAnswer(questions[0],t,true); $('#msg').value=''; return; }
    if (s && (past || !ACTIVE.includes(s.status))) { if (await addToRun(s.id, t)) $("#msg").value = ""; return; }
    const r = await api("/api/message", {text: t}); $("#msg").value = "";
    toast(r.duplicate ? "Already sent. Not saved twice." : r.read_next ? "Saved. The agents read it on their next turn. Resume the run if it is stopped." : "Sent. The agents answer it first.");
    select("chat"); };
  $("#msg").oninput = e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 220) + "px"; };
  $("#msg").onkeydown = ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); f.requestSubmit(); } };
}
function refresh() {
  if (view === "start" || view === "home" || view === "page") return;
  const s = S();
  const fresh=runQuestions(s).filter(q=>q.open && !surfacedQuestions.has(q.runId+':'+q.id));
  if (!past && fresh.length && !isTextEditingTarget(document.activeElement)) { for(const q of fresh) surfacedQuestions.add(q.runId+':'+q.id); setRunPane('chat'); }
  renderHeader(s); renderStatus(s); renderTimeline(s); renderRunMap(s); renderInspector(s); renderAlerts(s); renderBadges(live?.personal);
  renderSummaryDocument(s);
  const count=runQuestions(s).filter(q=>q.open).length; $('#chat-tab').textContent=count ? `Chat (${count})` : 'Chat';
  if(!past && fresh.length && !isTextEditingTarget(document.activeElement)) queueMicrotask(()=>[...document.querySelectorAll('.question-card[data-open="true"]')].find(card=>card.dataset.questionKey===s.id+':'+fresh[0].id)?.scrollIntoView({block:'nearest'}));
  applyRunPane();
  renderComposerState(s);
}

/* ---------------- waiting alerts, feedback, changes, security ---------------- */
const waitingNoticeSources = new Set();
function renderAlerts(s) {
  const current = new Set();
  for (const x of (past ? [] : (s?.waiting ?? []))) {
    const source = `waiting:${s.id}:${x.agent}:${x.kind}`;
    current.add(source);
    const perform = async act => {
      if (act === 'approve' || act === 'deny') await api('/api/answer', {agent:x.agent, approve:act === 'approve'});
      else if (act === 'restart') await api('/api/restart', {agent:x.agent});
      else if (act === 'nudge') await api('/api/control', {action:'nudge'});
      else { sel = 'a:' + x.agent; insTab = 'pane'; lastInsKey = ''; refresh(); }
    };
    const message = x.kind === 'stall' ? `${labelOf(x.agent)} needs a progress check.` :
      `${labelOf(x.agent)} is asking: ${x.why || ''} ${x.question || ''} ${(x.findings || []).map(f => f.reason).join(' ')}`;
    notices.publish(source, {message, identity:JSON.stringify([x.kind,x.why,x.question,x.findings]),
      actions:(x.kind === 'stall' ? ['nudge','restart','watch'] : ['approve','deny','watch']).map(act =>
        ({label:act[0].toUpperCase()+act.slice(1), run:() => perform(act)}))});
    waitingNoticeSources.add(source);
  }
  for (const source of waitingNoticeSources) if (!current.has(source)) { notices.clear(source); waitingNoticeSources.delete(source); }
}
function applyPrefs(p) {
  const root = document.documentElement, ui = p?.ui ?? {};
  root.dataset.density = ui.density ?? "comfortable";
  if (ui.theme && ui.theme !== "system") root.dataset.theme = ui.theme; else delete root.dataset.theme;
  if (!applyPrefs.done && p) { applyPrefs.done = true; if (ui.sidebar === "closed") $("#app").classList.add("no-side"); }
}
let shownChanges = false;
function renderBadges(p) {
  if (!p) return;
  applyPrefs(p);
  const ready = (p.proposals ?? []).filter(x => x.status === "ready").length, n = (p.new_changes?.length ?? 0) + ready;
  $("#btnChanges").hidden = false; $("#nChanges").textContent = p.applying ? "…" : n || "";
  $("#nSecurity").hidden = !p.security_count; $("#nSecurity").textContent = p.security_count;
  if (p.new_changes?.length && !shownChanges && !$("#sheet").open) { shownChanges = true; openSheet("changes"); }
}

}

function wireDefaults() {
  const toggleActiveHours = () => { $("#gActiveHours").disabled = !$("#gActiveLimit").checked; };
  $("#gActiveLimit").onchange = toggleActiveHours; toggleActiveHours();
  $("#gSave").onclick = async () => {
    try {
      await api("/api/config", {stall_minutes: +$("#gStall").value, sandbox: $("#gSandbox").value,
        max_active_runs: +$('#gRunLimit').value,
        unfinished_timeouts_enabled: $('#gUnfinishedTimeouts').checked,
        completion_summary_provider: $('#gCompletionProvider').value,
        decision_mode: $('#gDecisionMode').value,

    const fb = h.feedback;

      identity: JSON.stringify([h.running, h.current, h.code, h.code_now]), actions: [{label:'Restart', run: restartCore}]});

    if (fb && fb.kind !== 'editing') notices.publish('feature-feedback', {message: fb.text, identity: JSON.stringify([fb.id, fb.version, fb.kind, fb.text])});

  notices.publish('core-restarting', {message:'Restarting Duo to load the new code...'});
  await fetch("/api/shutdown", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({restart: true})}).catch(() => {});
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 1000));
    try { const h = await fetch("/api/health").then(r => r.json()); if (h.code && h.code === h.code_now && h.running === h.current) { saveRunDraft(); location.reload(); return; } } catch (e) {}
  }
  notices.publish('core-restarting', {message:'Duo did not come back. Run: python3 bin/duo serve'});
}
checkCode(); setInterval(checkCode, 15000);
async function showVersion() {
  try { const h = await fetch("/api/health").then(r => r.json());
    $("#duoVer").textContent = h.number ? "Duo " + h.number + (h.trying ? " (trying " + h.trying + ")" : "") + (h.core ? " · core " + h.core : "") : "Duo";
    const fb = $("#btnFeedback"); let n = fb && fb.querySelector(".n.req");
    if (fb && h.core_requests) { if (!n) { n = document.createElement("span"); n.className = "n req"; n.title = "Open core requests"; fb.append(n); } n.textContent = h.core_requests; }
    else if (n) n.remove(); } catch (e) {}
}
showVersion(); setInterval(showVersion, 15000);
/* ---------------- user feature components (contract 1.2) ----------------
   Adapter pattern. The server's adapters (engine/components.py) turn each feature component into one
   standard description: {kind, feature, module, ...}. Here, one adapter per kind puts that description on
   screen. A new kind of component = one adapter on each side; nothing else in the page changes.
   A feature module exports default function(el, duo); duo.call(method, path, body) reaches the feature's
   own routes at /api/f/<feature><path>, duo.navigate(key) opens a page. A module that fails shows a short
   note and does not break the page. */
const DuoComponents = window.DuoComponents = (() => {
  let cache = null;
  const load = async () => (cache = cache || fetch("/api/features").then(r => r.json()).catch(() => ({components: [], start_page: "home"})));
  const duoFor = (c, extra) => Object.assign({feature: c.feature, toast, navigate: k => go(k),
    call: async (method, path, body) => { const r = await fetch("/api/f/" + c.feature + path, method === "POST"
      ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})} : {});
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || String(r.status)); return j; }}, extra || {});
  async function mount(el, c, extra) {
    try { const mod = await import(c.module); await mod.default(el, duoFor(c, extra)); }
    catch (e) { el.textContent = "The feature " + c.feature + " could not show this: " + e.message; el.classList.add("hint"); }
  }
  const adapters = {
    // A panel inside a core slot.
    panel: {
      async place(c, root, extra) { const box = document.createElement("div"); box.className = "slot-panel"; box.dataset.feature = c.feature; root.append(box); await mount(box, c, extra); },
    },
    // A full page of the feature's own: a side bar button and the main view.
    page: {
      nav(c, navRoot) {
        if (c.nav !== "side") return;
        const b = document.createElement("button"); b.className = "new fnav"; b.dataset.page = c.key; b.textContent = c.title;
        b.onclick = () => go(c.key); navRoot.append(b);
      },
      async open(c) {
        $("#app").classList.add("page-view");
        view = "page"; past = null; sel = null;
        $("#main").innerHTML = `<div class="home"><div class="home-inner"><div class="fpage" id="fpage"></div></div></div>`;
        document.querySelectorAll(".fnav").forEach(x => x.classList.toggle("on", x.dataset.page === c.key));
        await mount($("#fpage"), c, {page: c.key});
      },
    },
  };
  async function renderSlot(root, slot, extra) {
    if (!root) return;
    root.replaceChildren();
    for (const c of (await load()).components || []) if (c.kind === "panel" && c.slot === slot) await adapters.panel.place(c, root, extra);
  }
  async function renderNav() {
    const nav = $("#featureNav"); if (!nav) return;
    nav.replaceChildren();
    for (const c of (await load()).components || []) { const a = adapters[c.kind]; if (a && a.nav) a.nav(c, nav); else if (!a) console.info("Duo: no page adapter for component kind", c.kind); }
  }
  async function openPage(key) {
    const c = ((await load()).components || []).find(x => x.kind === "page" && x.key === key);
    if (!c) { toast("That page is not available. Its feature may be off."); return showHome(); }
    await adapters.page.open(c);
  }
  return {renderSlot, renderNav, openPage, adapters,
    startPage: async () => (await load()).start_page || "home",
    pages: async () => ((await load()).components || []).filter(c => c.kind === "page"),
    reset: () => { cache = null; }};
})();
window.DuoSlots = {render: DuoComponents.renderSlot};          // contract 1.0 name

/* Addresses: #/home, #/new, #/f/<feature>/<page>. */
function hashOf(key) { if (["home", "new", "features"].includes(key)) return "#/" + key; const m = /^f:([^:]+):(.+)$/.exec(key || ""); return m ? "#/f/" + m[1] + "/" + m[2] : "#/home"; }
function route() {
  const h = location.hash;
  if (h === "#/new") return showStart();
  if (h === "#/features") return showFeatures();
  const m = /^#\/f\/([^/]+)\/(.+)$/.exec(h);
  if (m) return DuoComponents.openPage("f:" + m[1] + ":" + m[2]);
  return showHome();
}
function go(key) { const h = hashOf(key); if (location.hash === h) route(); else location.hash = h; }
window.addEventListener("hashchange", () => { if (location.hash) route(); });
DuoComponents.renderNav();
DuoComponents.renderSlot($("#slotHeader"), "header", {});
let lastLiveUpdate=0, pollingState=false;
function receiveLiveState(data) {
    lastLiveUpdate=Date.now();live=data;
    if (past) {
      const savedId = past.id;
      api('/api/session?' + new URLSearchParams({id:savedId})).then(saved => {
        if (past?.id === savedId) { past = saved; refresh(); }
      }).catch(() => {});
    }
    // Open on Home when no run is working; a working run opens on its timeline as before.
    if (!window.__duoOpened) { window.__duoOpened = true;
      if (location.hash) route();
      else if (!(live.session && ACTIVE.includes(live.session.status))) DuoComponents.startPage().then(go); }
  const st = JSON.stringify([live.session?.id, live.session?.status, live.runs?.map(r=>[r.id,r.status,r.paused])]);
    if (st !== lastStatus) { lastStatus = st; loadSessions(); }
    if (!frame) {frame=1;queueMicrotask(() => { frame = 0; refresh(); });}
}
async function pollLiveState() {
  if(pollingState) return;pollingState=true;
  try {const response=await fetch('/api/state');if(response.ok)receiveLiveState(await response.json());}
  catch(error){recordUIError(error);}finally{pollingState=false;}
}
function connect() {
const es = new EventSource("/api/events");
  es.onmessage = ev => receiveLiveState(JSON.parse(ev.data));
  es.onerror = () => { es.close(); $("#stext") && ($("#stext").textContent = "Lost the connection to Duo. Reconnecting."); setTimeout(connect, 2000); };
}
$("#newBtn").onclick = () => showStart();
$("#homeBtn").onclick = () => go("home");
$("#featuresBtn").onclick = () => go("features");
$("#toggleSide").onclick = () => $("#app").classList.toggle("no-side");
document.addEventListener("keydown", ev => {
  if (ev.defaultPrevented || ev.isComposing || ev.ctrlKey || ev.metaKey || ev.altKey || isTextEditingTarget(ev.target) || isTextEditingTarget(document.activeElement)) return;
  if (ev.key === "f" && !$("#sheet").open) { ev.preventDefault(); openSheet("feedback"); return; }
  if (ev.key === "Escape" && !$("#sheet").open) select(null);
  if (ev.key === "n" && view !== "start") { ev.preventDefault(); showStart(); }
  if (ev.key === "c" && S() && !ACTIVE.includes(S().status) && S().status !== "done") { ev.preventDefault(); continueRun(S().id); }
  if (ev.key === "/" && $("#msg")) { ev.preventDefault(); $("#msg").focus(); }
  if (ev.key === "j" || ev.key === "k") {
    const rows = [...document.querySelectorAll("#timeline [data-sel]")]; if (!rows.length) return;
    const i = rows.findIndex(r => r.dataset.sel === sel); const nx = rows[Math.max(0, Math.min(rows.length - 1, i + (ev.key === "j" ? 1 : -1)))];
    select(nx.dataset.sel); nx.focus();
  }
});
bindComposer(); loadSessions();
// ?snapshot=1: no live event stream, open the address at once (used by Duo's screenshots of version copies).
if (new URLSearchParams(location.search).has("snapshot")) { window.__duoOpened = true; route(); } else {connect();pollLiveState();setInterval(()=>{if(Date.now()-lastLiveUpdate>10000)pollLiveState();},10000);}
</script>
</body>
